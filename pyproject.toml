[project]
name = "docsnap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manoj Meena", email = "232816375+manojmeena-iitb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
docsnap = "docsnap:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
